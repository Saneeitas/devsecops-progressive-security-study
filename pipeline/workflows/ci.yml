name: Baseline CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.BASELINE_TEST_DATABASE_PASSWORD }}
          POSTGRES_DB: devsecops_study_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devsecops_study_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:${{ secrets.BASELINE_TEST_DATABASE_PASSWORD }}@localhost:5432/devsecops_study_test
      DATABASE_URL: postgresql://postgres:${{ secrets.BASELINE_TEST_DATABASE_PASSWORD }}@localhost:5432/devsecops_study_test
      JWT_SECRET: ${{ secrets.BASELINE_TEST_JWT_SECRET }}
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
